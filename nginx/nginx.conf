user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # High-concurrency buffer optimization
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    server_tokens off;

    # -------------------------------------------------------------
    # ArvanCloud Anycast CDN Real-IP Extraction & Client Detection
    # -------------------------------------------------------------
    set_real_ip_from 185.143.232.0/22;
    set_real_ip_from 188.229.116.16/30;
    set_real_ip_from 94.101.182.0/27;
    set_real_ip_from 2.144.3.128/28;
    set_real_ip_from 37.32.16.0/27;
    set_real_ip_from 37.32.17.0/27;
    set_real_ip_from 37.32.18.0/27;
    set_real_ip_from 37.32.19.0/27;
    set_real_ip_from 185.215.232.0/22;
    set_real_ip_from 178.131.120.48/28;
    set_real_ip_from 94.101.183.0/28;
    set_real_ip_from 78.157.36.112/28;
    set_real_ip_from 95.38.61.80/28;
    set_real_ip_from 193.24.119.0/29;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting & connection limiting zones (prevents overload / DDoS)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Smart redirection to HTTPS that completely prevents CDN redirect loops
    map "$http_x_forwarded_proto:$http_x_request_id:$host" $should_redirect_to_https {
        "~*^https:" 0;
        "~*:[a-f0-9]+:" 0;                      # ArvanCloud CDN edge request -> DO NOT REDIRECT
        "~*::(raally\.ir|www\.raally\.ir)$" 1;  # Direct cleartext HTTP visitor without CDN -> redirect
        default 0;
    }

    upstream backend_api {
        server backend:8000;
        keepalive 64;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 64;
    }

    # -------------------------------------------------------------
    # HTTP Server: Redirect domain requests to HTTPS, serve ACME & direct IP
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name localhost raally.ir www.raally.ir 213.176.121.117;

        # Security Headers for HTTP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ACME-challenge for Certbot SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Automatically redirect domain visitors to secure HTTPS (safe from CDN loops)
        location / {
            if ($should_redirect_to_https) {
                return 301 https://raally.ir$request_uri;
            }
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # -------------------------------------------------------------
    # HTTPS Server: High-Performance Secure Production Gateway
    # -------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost raally.ir www.raally.ir;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;

        # Canonical redirect: force www.raally.ir to https://raally.ir
        if ($host = 'www.raally.ir') {
            return 301 https://raally.ir$request_uri;
        }

        # Hardened Modern Security Headers & HSTS
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://raally.ir https://gateway.shaparak.ir; frame-src 'self' https://gateway.shaparak.ir; frame-ancestors 'self';" always;

        # Static assets aggressive caching (relieves backend/frontend load)
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpe?g|gif|svg|webp)$ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Dedicated Protection for Sensitive OTP SMS Endpoints (Prevents SMS Flooding / Wallet Drain)
        location /api/v1/auth/otp/ {
            limit_req zone=otp_limit burst=2 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Persistent Uploaded Media Serving
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # API Routing with high-concurrency rate limit & connection pool
        location /api/ {
            limit_req zone=api_limit burst=120 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Frontend Application Routing
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
