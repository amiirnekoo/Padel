version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rally_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-padel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padel_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-padel_production}
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-padel_user} -d ${POSTGRES_DB:-padel_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis:
    image: redis:7-alpine
    container_name: rally_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rally_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-padel_user}:${POSTGRES_PASSWORD:-padel_secret_password_2026}@db:5432/${POSTGRES_DB:-padel_production}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-padel-jwt-key-for-development-2026}
      API_V1_STR: /api/v1
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-MOCK}
      SMS_PROVIDER: ${SMS_PROVIDER:-SIMULATOR}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rally_frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: rally_gateway
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  postgres_data:
  redis_data:
