name: Continuous Integration & Deployment (CI/CD)
# workflow استقرار خودکار و آزمون‌های مداوم پروژه Padel / Rally

on:
  push:
    branches:
      - 001-court-booking-engine
      - main

jobs:
  test:
    name: Run Pytest & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest "pytest-asyncio==0.23.8"

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests -v --tb=short 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/001-court-booking-engine' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via Native SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.SSH_PASSPHRASE }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # Check if SSH_KEY is present
          if [ -z "$SSH_KEY" ]; then
            echo "❌ SSH_KEY secret is EMPTY or NOT SET in repository secrets!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "### SSH Debug Telemetry" >> $GITHUB_STEP_SUMMARY
          ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key root@213.176.121.117 "uptime" 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true

          DEPLOY_SCRIPT="cd /root/Padel && git fetch origin && git checkout $BRANCH_NAME && git reset --hard origin/$BRANCH_NAME && docker compose build && docker compose up -d && docker system prune -f"

          if [ -n "$SSH_PASS" ]; then
            sshpass -P passphrase -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@213.176.121.117 "$DEPLOY_SCRIPT" || \
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@213.176.121.117 "$DEPLOY_SCRIPT"
          else
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@213.176.121.117 "$DEPLOY_SCRIPT"
          fi
