<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Volt Gradient -->
    <linearGradient id="voltNeon" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#D7FF1E" />
      <stop offset="35%" stop-color="#E8FF33" />
      <stop offset="75%" stop-color="#C4F500" />
      <stop offset="100%" stop-color="#9EE000" />
    </linearGradient>

    <!-- 3D Padel Ball -->
    <radialGradient id="padelSphere3D" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="22%" stop-color="#F5FF47" />
      <stop offset="55%" stop-color="#C8FA00" />
      <stop offset="85%" stop-color="#8DBF00" />
      <stop offset="100%" stop-color="#557700" />
    </radialGradient>

    <!-- Clean shadow -->
    <filter id="typographyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Glowing Trajectory -->
    <filter id="trajectoryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.0" flood-color="#CCFF00" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. KINETIC TRAJECTORY "2" -->
  <g filter="url(#trajectoryGlow)">
    <path d="M 72 13
             C 76 10.5 83 7 93 5.5
             C 103 4 113 4 120 7
             C 127 10 129 16 126 22
             C 122 30 113 36 106 41
             C 102 43.5 104 45.5 108 45.5
             C 114 45.5 125 42 136 33.5"
          stroke="url(#voltNeon)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none" />
  </g>

  <!-- 2. OFFICIAL 3D PADEL BALL -->
  <g transform="translate(147.5, 25.5)">
    <circle cx="0" cy="0" r="8.5" fill="url(#padelSphere3D)" />
    <circle cx="0" cy="0" r="8.5" stroke="#6F9100" stroke-width="0.5" fill="none" opacity="0.6" />
    <path d="M -2.2 -8.0 C -0.8 -3.8 2.2 -1.2 7.0 -1.6"
          stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.95" />
    <path d="M -2.2 -8.0 C -0.8 -3.8 2.2 -1.2 7.0 -1.6"
          stroke="#425700" stroke-width="0.38" stroke-linecap="round" fill="none" opacity="0.55" />
    <path d="M -7.3 3.8 C -3.5 3.3 0.8 5.2 3.5 7.6"
          stroke="#FFFFFF" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.95" />
    <path d="M -7.3 3.8 C -3.5 3.3 0.8 5.2 3.5 7.6"
          stroke="#425700" stroke-width="0.36" stroke-linecap="round" fill="none" opacity="0.55" />
  </g>

  <!-- 3. PERSIAN CALLIGRAPHY «رالی» -->
  <g stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#typographyShadow)">
    <!-- Letter 'ر' (Re) -->
    <path d="M 76 17.5 L 76 28.5 C 76 34.5 72.5 39 62 40" />

    <!-- Letter 'ا' (Alef) -->
    <path d="M 61 5 L 61 24.5" />

    <!-- Letter 'ل' (Lam) + 'ی' (Ye) -->
    <path d="M 48 5
             L 48 24
             L 34 24
             C 28 24 28 29 28 32
             C 28 36 24 39.5 17 39.5
             C 10 39.5 6 36 6 31
             L 6 22.5" />
  </g>

  <!-- 4. ATHLETIC WORDMARK «R A L L Y» -->
  <g fill="#FFFFFF" transform="translate(0, 53.5)" filter="url(#typographyShadow)">
    
    <!-- R -->
    <path d="M 6 7.5 L 6 0 L 10.8 0 C 12.9 0 14.3 1 14.3 2.6 C 14.3 3.8 13.5 4.7 12.2 5 L 14.5 7.5 L 12.2 7.5 L 10.2 5.2 L 8.1 5.2 L 8.1 7.5 Z M 8.1 3.5 L 10.5 3.5 C 11.5 3.5 12.1 3.1 12.1 2.6 C 12.1 2 11.5 1.6 10.5 1.6 L 8.1 1.6 Z" />
    <!-- A -->
    <path d="M 20.5 7.5 L 24 0 L 26.2 0 L 29.7 7.5 L 27.4 7.5 L 26.7 5.8 L 23.5 5.8 L 22.8 7.5 Z M 24.1 4.2 L 26.1 4.2 L 25.1 1.9 Z" />
    <!-- L (1) -->
    <path d="M 36.5 7.5 L 36.5 0 L 38.7 0 L 38.7 5.8 L 43.2 5.8 L 43.2 7.5 Z" />
    <!-- L (2) -->
    <path d="M 49.5 7.5 L 49.5 0 L 51.7 0 L 51.7 5.8 L 56.2 5.8 L 56.2 7.5 Z" />
    <!-- Y -->
    <path d="M 62.5 0 L 65.8 4.3 L 65.8 7.5 L 68 7.5 L 68 4.3 L 71.3 0 L 68.9 0 L 66.9 2.8 L 64.9 0 Z" />
    
  </g>
</svg>