<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Volt Neon Gradient -->
    <linearGradient id="voltNeon" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#EAFF38" />
      <stop offset="30%" stop-color="#D7FF1E" />
      <stop offset="70%" stop-color="#B2E600" />
      <stop offset="100%" stop-color="#7EA800" />
    </linearGradient>

    <!-- 3D Padel Ball Radial Gradient -->
    <radialGradient id="padelSphere3D" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="22%" stop-color="#F6FF4D" />
      <stop offset="55%" stop-color="#CAF700" />
      <stop offset="85%" stop-color="#8EBE00" />
      <stop offset="100%" stop-color="#4B6900" />
    </radialGradient>

    <!-- Glow & Shadow filters -->
    <filter id="trajectoryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#CCFF00" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.0" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="ballShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Luxury Brand Squircle Background (inset by 1px so stroke is never clipped) -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#080F1D" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#D7FF1E" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Centered Kinetic Emblem Group -->
  <g transform="translate(-35.5, 17.2) scale(0.60)">
    <!-- 1. KINETIC TRAJECTORY -->
    <g filter="url(#trajectoryGlow)">
      <path d="M 68 14.5
               C 74 11 83 7 93 5.5
               C 103 4 113 4 120 7
               C 127 10 129 16 126 22
               C 122 30 113 36 106 41
               C 102 43.5 104 45.5 108 45.5
               C 114 45.5 125 42 136 33.5"
            stroke="url(#voltNeon)"
            stroke-width="6.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none" />
    </g>

    <!-- 2. OFFICIAL 3D PADEL BALL -->
    <g transform="translate(148, 25.5)" filter="url(#ballShadow)">
      <circle cx="0" cy="0" r="11" fill="url(#padelSphere3D)" />
      <circle cx="0" cy="0" r="11" stroke="#486100" stroke-width="0.8" fill="none" opacity="0.75" />
      <!-- Seam lines -->
      <path d="M -2.8 -10.3 C -1.0 -4.9 2.8 -1.5 9.0 -2.1"
            stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.95" />
      <path d="M -2.8 -10.3 C -1.0 -4.9 2.8 -1.5 9.0 -2.1"
            stroke="#344500" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.65" />
      <path d="M -9.5 4.9 C -4.5 4.3 1.0 6.7 4.5 9.8"
            stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.95" />
      <path d="M -9.5 4.9 C -4.5 4.3 1.0 6.7 4.5 9.8"
            stroke="#344500" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.65" />
    </g>
  </g>
</svg>